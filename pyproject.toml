[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "RUF", "N", "PT", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"tests/*" = ["N802"]
